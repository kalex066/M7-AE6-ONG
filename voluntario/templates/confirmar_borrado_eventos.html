{% extends 'base.html' %}

{% block title %}Eliminar Evento{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Confirmar eliminación</h4>
        </div>
        <div class="card-body">
            <p class="fs-5">
                ¿Estás segura de que deseas eliminar el evento <strong>{{ evento.titulo }}</strong>? Esta acción no se puede deshacer.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'ver_eventos' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, borrar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
