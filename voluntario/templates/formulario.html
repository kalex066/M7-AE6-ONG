{% extends 'base.html' %}

{% block title %} Registro de Voluntarios {% endblock %}

{% block content %}
<h4 class="mt-4 mb-4">{% if form.instance.pk %}Editar{% else %}Nuevo{% endif %} Voluntario</h4>
<form method="POST" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'home' %}" class="btn btn-danger">Cancelar</a>
</form>
{% endblock %}
